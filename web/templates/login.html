<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <title>Discord Login</title>
    <style>
      body {
        font-family: sans-serif;
        background: #0f172a;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .card {
        background: #1e293b;
        padding: 32px 40px;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        text-align: center;
      }
      a.button {
        display: inline-block;
        margin-top: 16px;
        background: #5865F2;
        color: white;
        text-decoration: none;
        padding: 12px 20px;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Discord Web 認証</h1>
      <p>アカウントを連携して、サービスへログインします。</p>
      <a class="button" href="/discord-login">Discordでログイン</a>
    </div>
  </body>
</html>
